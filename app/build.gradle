//file:noinspection GrDeprecatedAPIUsage
plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.example.gymevo'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.gymevo"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField "boolean", "IMAGE_SYNC_ENABLED", "false"
        buildConfigField "String", "IMAGE_SYNC_BASE_URL", '""'
        buildConfigField "String", "IMAGE_SYNC_UPLOAD_PATH", '"/v1/exercise-images"'
        buildConfigField "int", "IMAGE_SYNC_CONNECT_TIMEOUT_MS", "10000"
        buildConfigField "int", "IMAGE_SYNC_READ_TIMEOUT_MS", "20000"
        buildConfigField "String", "IMAGE_SYNC_AUTH_PREFS_NAME", '""'
        buildConfigField "String", "IMAGE_SYNC_AUTH_TOKEN_KEY", '""'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
}

dependencies {
    // Room Database
    implementation "androidx.room:room-runtime:2.8.4"
    annotationProcessor "androidx.room:room-compiler:2.8.4"

    // Exemple pour Glide
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'


    // AppCompat library
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.appcompat:appcompat-resources:1.7.1'


    // RecyclerView and selection
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.recyclerview:recyclerview-selection:1.2.0"

    // Material Design components
    implementation 'com.google.android.material:material:1.13.0'

    // DataStore (preferences) + RxJava3
    implementation "androidx.datastore:datastore-preferences:1.2.0"
    implementation "androidx.datastore:datastore-preferences-rxjava3:1.2.0"
    implementation "io.reactivex.rxjava3:rxjava:3.1.12"

    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ConstraintLayout
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'

    // Navigation components
    implementation 'androidx.navigation:navigation-fragment:2.9.7'
    implementation 'androidx.navigation:navigation-ui:2.9.7'


    // Activity library
    implementation 'androidx.activity:activity:1.12.4'

    // Background sync
    implementation 'androidx.work:work-runtime:2.10.3'

    // Testing libraries
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.work:work-testing:2.10.3'
}
